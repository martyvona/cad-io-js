# The Contributor License Agreement (CLA.md; the user, 2026-11-01): every pull request's authors must have signed it,
# by commenting the sentence below on a pull request; contributor-assistant/github-action checks and records it, the
# signatures in signatures/cla.json on this repository's cla-signatures branch (which must exist and not be protected).
# The action is pinned to v2.6.1's commit. pull_request_target runs this workflow as the base branch has it, with
# write access, but never checks out or runs the pull request's code.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/martyvona/cad-io-js/blob/main/CLA.md
          branch: cla-signatures
          allowlist: 'martyvona,dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          signed-commit-message: '$contributorName signed the CLA in $owner/$repo#$pullRequestNo'
          create-file-commit-message: 'CLA signatures (CLA.md)'
