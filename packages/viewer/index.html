<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>cad-viewer</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1f1f1f">
  <style>
    :root { --side: 300px; }
    /* No pull-to-refresh or bouncing while dragging the view; the height follows phones' toolbars. */
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #404040;
      overscroll-behavior: none; }
    /* No long-press menu or text selection on the model. */
    #view { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #side {
      position: absolute; left: 0; top: 0; bottom: 0; width: var(--side); background: #1f1f1f; color: #ddd;
      font: 12px/18px system-ui, -apple-system, "Segoe UI", sans-serif; border-right: 1px solid #111;
    }
    #tree { position: absolute; inset: 0; }
    /* The handle that drags the panel's width (side-handle.ts), over its right edge. */
    #side-handle {
      position: absolute; top: 0; bottom: 0; right: -4px; width: 7px; z-index: 3; cursor: col-resize;
      touch-action: none;
    }
    #side-handle:hover, #side-handle.dragging { background: rgba(255, 154, 46, 0.5); }
    #view { position: absolute; top: 0; bottom: 0; right: 0; left: var(--side); }
    body.tree-closed #side { display: none; }
    body.tree-closed #view { left: 0; }
    /* Narrow screens: the tree over the view, when open. */
    @media (max-width: 700px) {
      #view { left: 0; }
      #side { width: 85%; z-index: 2; box-shadow: 4px 0 12px rgba(0, 0, 0, 0.5); }
      #side-handle { display: none; }
    }
    #view canvas { display: block; }
    /* The controls flush with the right edge (lil-gui leaves 15 pixels; past a notch's safe area on phones). */
    body .lil-gui.autoPlace { right: env(safe-area-inset-right, 0); }
    #status {
      position: absolute; left: 0; bottom: env(safe-area-inset-bottom, 0); max-width: calc(100% - 16px);
      padding: 4px 8px;
      font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #ddd; background: rgba(0, 0, 0, 0.5);
      pointer-events: none; white-space: pre-wrap;
    }
    #status:empty { display: none; }
    #details {
      position: absolute; left: 8px; top: 8px; max-width: min(420px, calc(100% - 16px)); padding: 6px 10px;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #ddd; background: rgba(0, 0, 0, 0.7);
      white-space: pre-wrap; border-radius: 4px; pointer-events: none;
    }
    #details[hidden] { display: none; }
    #status.error { color: #ff8a80; }
    .tree-scroller:focus { outline: none; }
    .tree-row { cursor: default; user-select: none; -webkit-user-select: none; }
    .tree-row.selected { background: #2c5d87; }
    .tree-row.focused { box-shadow: inset 0 0 0 1px #6a9fd0; }
    .tree-row.hidden { color: #777; }
    .tree-expander { flex: none; width: 16px; height: 18px; position: relative; }
    .tree-expander.closed::before, .tree-expander.open::before {
      content: ""; position: absolute; left: 5px; top: 5px; border: 4px solid transparent;
    }
    .tree-expander.closed::before { border-left: 6px solid #aaa; border-right: 0; }
    .tree-expander.open::before { border-top: 6px solid #aaa; border-bottom: 0; left: 4px; top: 7px; }
    .tree-content { display: flex; align-items: center; gap: 4px; overflow: hidden; }
    .tree-icon { display: inline-flex; color: #9bb4cc; }
    .tree-row.hidden .tree-icon { color: #666; }
    .tree-name { overflow: hidden; text-overflow: ellipsis; }
    /* Modal dialogs (dialog.ts). */
    .cv-dialog {
      max-width: min(560px, calc(100% - 32px)); padding: 16px 20px; color: #ddd; background: #1f1f1f;
      border: 1px solid #555; border-radius: 6px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .cv-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    .cv-dialog.error { border-color: #c0504d; }
    .cv-dialog h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .cv-dialog.error h2 { color: #ff8a80; }
    .cv-dialog p { margin: 0 0 8px; }
    .cv-dialog table { margin: 0 0 10px; border-collapse: collapse; }
    .cv-dialog td { padding: 1px 12px 1px 0; vertical-align: top; }
    .cv-dialog td + td {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all;
    }
    .cv-dialog label { display: block; margin: 0 0 12px; }
    .cv-dialog input {
      display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 5px 7px; color: #eee;
      background: #2a2a2a; border: 1px solid #555; border-radius: 3px;
      font: 12px ui-monospace, Menlo, Consolas, monospace;
    }
    .cv-dialog .buttons { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .cv-dialog button {
      padding: 5px 14px; color: #ddd; background: #333; border: 1px solid #555; border-radius: 3px; font: inherit;
      cursor: pointer;
    }
    .cv-dialog button:hover { background: #3c3c3c; }
    .cv-dialog button.primary { color: #fff; background: #2c5d87; border-color: #3d79ab; }
    .cv-dialog button.primary:hover { background: #336a99; }
  </style>
</head>
<body>
  <div id="side"><div id="tree"></div></div>
  <div id="view"><div id="status"></div><div id="details" hidden></div></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
