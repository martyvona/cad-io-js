<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>cad-viewer</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1f1f1f">
  <script>
    // The theme (theme.ts's resolveTheme: the one chosen in this browser, else the system's), before the first paint,
    // so a light page doesn't flash dark.
    let choice = null;
    try { choice = localStorage.getItem('cad-viewer.theme'); } catch { /* no storage: auto */ }
    if (choice === 'light' || choice !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.dataset.theme = 'light';
    }
    // The view's own background, if one is chosen (theme.ts's applyCustomBackground).
    try {
      const b = JSON.parse(localStorage.getItem('cad-viewer.background') ?? 'null');
      if (b && b.on === true && /^#[0-9a-f]{6}$/i.test(b.color)) {
        document.documentElement.style.setProperty('--view-bg', b.color);
      }
    } catch { /* none */ }
  </script>
  <style>
    :root { --side: 300px; }
    /* The colours, dark and light (the user, 2026-10-27; theme.ts switches them, View's Theme). */
    :root {
      --view-bg: #404040; --panel-bg: #1f1f1f; --panel-fg: #ddd; --panel-border: #111; --muted: #777;
      --muted-icon: #666; --expander: #aaa; --icon: #9bb4cc; --row-selected: #2c5d87; --row-focus: #6a9fd0;
      --overlay-fg: #ddd; --status-bg: rgba(0, 0, 0, 0.5); --details-bg: rgba(0, 0, 0, 0.7); --error-fg: #ff8a80;
      --failed-fg: #ff6b6b; --grip: rgba(255, 255, 255, 0.35); --input-fg: #eee; --input-bg: #2a2a2a; --border: #555;
      --button-bg: #333; --button-hover: #3c3c3c; --link: #8ab4f8;
    }
    :root[data-theme="light"] {
      --view-bg: #ffffff; --panel-bg: #f4f4f4; --panel-fg: #222; --panel-border: #c4c4c4; --muted: #999;
      --muted-icon: #aaa; --expander: #666; --icon: #4a7096; --row-selected: #b3d4f0; --row-focus: #4a86c5;
      --overlay-fg: #222; --status-bg: rgba(255, 255, 255, 0.75); --details-bg: rgba(255, 255, 255, 0.85);
      --error-fg: #c62828; --failed-fg: #d32f2f; --grip: rgba(0, 0, 0, 0.3); --input-fg: #111; --input-bg: #fff;
      --border: #bbb; --button-bg: #e8e8e8; --button-hover: #dcdcdc; --link: #1a5fb4;
    }
    /* lil-gui's own light theme (its documentation's). */
    :root[data-theme="light"] .lil-gui {
      --background-color: #f6f6f6; --text-color: #3d3d3d; --title-background-color: #efefef;
      --title-text-color: #3d3d3d; --widget-color: #eaeaea; --hover-color: #f0f0f0; --focus-color: #fafafa;
      --number-color: #07aacf; --string-color: #8da300;
    }
    /* A replay's pointer, in real time (recorder.ts). */
    .replay-pointer { position: fixed; width: 18px; height: 18px; margin: -11px 0 0 -11px; border-radius: 50%;
      border: 2px solid #ff9a2e; background: rgba(255, 154, 46, 0.35); pointer-events: none; z-index: 1000; }
    .replay-pointer[hidden] { display: none; }
    /* A control as a replay changes it. */
    .replay-flash { animation: replay-flash 1.2s ease-out; }
    @keyframes replay-flash { from { background: rgba(255, 154, 46, 0.65); } to { background: transparent; } }
    /* No pull-to-refresh or bouncing while dragging the view; the height follows phones' toolbars. */
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: var(--view-bg);
      overscroll-behavior: none; }
    /* No long-press menu or text selection on the model. */
    #view { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #side {
      position: absolute; left: 0; top: 0; bottom: 0; width: var(--side); background: var(--panel-bg);
      color: var(--panel-fg);
      font: 12px/18px system-ui, -apple-system, "Segoe UI", sans-serif; border-right: 1px solid var(--panel-border);
    }
    #tree { position: absolute; inset: 0; }
    /* The handle that drags the panel's width (side-handle.ts), over its right edge. */
    #side-handle {
      position: absolute; top: 0; bottom: 0; right: -4px; width: 7px; z-index: 3; cursor: col-resize;
      touch-action: none;
    }
    #side-handle:hover, #side-handle.dragging { background: rgba(255, 154, 46, 0.5); }
    /* Touch: no hover to show it, and a finger is wide: a wider grip, always shown. */
    @media (pointer: coarse) {
      #side-handle { right: -12px; width: 24px; }
      #side-handle::after {
        content: ''; position: absolute; left: 9px; top: 50%; width: 6px; height: 48px; margin-top: -24px;
        border-radius: 3px; background: var(--grip);
      }
      #side-handle:hover { background: none; }
    }
    #view { position: absolute; top: 0; bottom: 0; right: 0; left: var(--side); }
    body.tree-closed #side { display: none; }
    body.tree-closed #view { left: 0; }
    /* Narrow screens (phones): the tree over the view, when open, at the narrowest it can be dragged to by default
       (side-handle.ts's MIN), and at most to 40 pixels from the right edge. */
    @media (max-width: 700px) {
      :root { --side: 140px; }
      #view { left: 0; }
      #side { width: min(var(--side), calc(100% - 40px)); z-index: 2; box-shadow: 4px 0 12px rgba(0, 0, 0, 0.5); }
    }
    #view canvas { display: block; }
    /* The controls flush with the right edge (lil-gui leaves 15 pixels; past a notch's safe area on phones). */
    body .lil-gui.autoPlace { right: env(safe-area-inset-right, 0); }
    #status {
      position: absolute; left: 0; bottom: env(safe-area-inset-bottom, 0); max-width: calc(100% - 16px);
      padding: 4px 8px;
      font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--overlay-fg); background: var(--status-bg);
      pointer-events: none; white-space: pre-wrap;
    }
    #status:empty { display: none; }
    #details {
      position: absolute; left: 8px; top: 8px; max-width: min(420px, calc(100% - 16px)); padding: 6px 10px;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--overlay-fg); background: var(--details-bg);
      white-space: pre-wrap; border-radius: 4px; pointer-events: none;
    }
    #details[hidden] { display: none; }
    /* Faded after a while with no change (ui.ts's autoHide). */
    #status, #details { transition: opacity 0.6s; }
    #status.faded, #details.faded { opacity: 0; }
    #status.error { color: var(--error-fg); }
    .tree-scroller:focus { outline: none; }
    .tree-row { cursor: default; user-select: none; -webkit-user-select: none; }
    .tree-row.selected { background: var(--row-selected); }
    .tree-row.focused { box-shadow: inset 0 0 0 1px var(--row-focus); }
    .tree-row.hidden { color: var(--muted); }
    .tree-expander { flex: none; width: 16px; height: 18px; position: relative; }
    .tree-expander.closed::before, .tree-expander.open::before {
      content: ""; position: absolute; left: 5px; top: 5px; border: 4px solid transparent;
    }
    .tree-expander.closed::before { border-left: 6px solid var(--expander); border-right: 0; }
    .tree-expander.open::before { border-top: 6px solid var(--expander); border-bottom: 0; left: 4px; top: 7px; }
    .tree-content { display: flex; align-items: center; gap: 4px; flex: none; }
    .tree-icon { display: inline-flex; color: var(--icon); }
    .tree-row.hidden .tree-icon { color: var(--muted-icon); }
    /* Failed to mesh (tree-panel.ts): red, a broken icon. */
    .tree-row.failed, .tree-icon.broken { color: var(--failed-fg); }
    .tree-row.hidden.failed { opacity: 0.6; }
    /* Appearance overrides (tree-panel.ts): an eye after the name, crossed out for a hidden one. */
    .tree-override { display: inline-flex; color: var(--icon); opacity: 0.85; }
    /* Context menus (context-menu.ts). */
    .cv-menu {
      position: fixed; z-index: 2000; min-width: 160px; padding: 4px 0; color: var(--panel-fg);
      background: var(--panel-bg); border: 1px solid var(--border); border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .cv-menu button {
      display: block; width: 100%; padding: 4px 14px; color: inherit; background: none; border: 0; font: inherit;
      text-align: left; cursor: pointer;
    }
    .cv-menu button:hover, .cv-menu button:focus { background: var(--button-hover); outline: none; }
    /* Modal dialogs (dialog.ts). */
    .cv-dialog {
      max-width: min(560px, calc(100% - 32px)); padding: 16px 20px; color: var(--panel-fg); background: var(--panel-bg);
      border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .cv-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    .cv-dialog.error { border-color: #c0504d; }
    .cv-dialog h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .cv-dialog.error h2 { color: var(--error-fg); }
    .cv-dialog a { color: var(--link); }
    .cv-dialog p { margin: 0 0 8px; }
    .cv-dialog .table { max-height: 50vh; overflow: auto; margin: 0 0 10px; }
    .cv-dialog table { border-collapse: collapse; }
    .cv-dialog td { padding: 1px 12px 1px 0; vertical-align: top; }
    .cv-dialog td + td {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all;
    }
    .cv-dialog label { display: block; margin: 0 0 12px; }
    .cv-dialog input, .cv-dialog textarea {
      display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 5px 7px; color: var(--input-fg);
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 3px;
      font: 12px ui-monospace, Menlo, Consolas, monospace;
    }
    .cv-dialog select { display: block; margin-top: 4px; padding: 4px 6px; color: var(--input-fg);
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 3px; font: inherit; }
    .cv-dialog .alpha { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .cv-dialog .alpha input[type=range] { flex: 1; width: auto; margin: 0; padding: 0; }
    .cv-dialog .alpha input[type=number] { flex: none; width: 72px; margin: 0; }
    .cv-dialog .alpha input:disabled { opacity: 0.6; }
    .cv-dialog .note { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .cv-dialog .buttons { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .cv-dialog button {
      padding: 5px 14px; color: var(--panel-fg); background: var(--button-bg); border: 1px solid var(--border);
      border-radius: 3px; font: inherit; cursor: pointer;
    }
    .cv-dialog button:hover { background: var(--button-hover); }
    .cv-dialog button.primary { color: #fff; background: #2c5d87; border-color: #3d79ab; }
    .cv-dialog button.primary:hover { background: #336a99; }
  </style>
</head>
<body>
  <div id="side"><div id="tree"></div></div>
  <div id="view"><div id="status"></div><div id="details" hidden></div></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
