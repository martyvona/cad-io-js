<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>cad-viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #404040; }
    #view { position: absolute; inset: 0; }
    #view canvas { display: block; }
    #status {
      position: absolute; left: 0; bottom: 0; max-width: calc(100% - 16px); padding: 4px 8px;
      font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #ddd; background: rgba(0, 0, 0, 0.5);
      pointer-events: none; white-space: pre-wrap;
    }
    #status:empty { display: none; }
    #status.error { color: #ff8a80; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="status"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
