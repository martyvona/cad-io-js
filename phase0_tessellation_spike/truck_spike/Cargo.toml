[package]
name = "truck_spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
truck-meshalgo = { path = "../../third_party/truck/truck-meshalgo" }
truck-stepio = { path = "../../third_party/truck/truck-stepio" }
truck-topology = { path = "../../third_party/truck/truck-topology" }
truck-polymesh = { path = "../../third_party/truck/truck-polymesh" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
