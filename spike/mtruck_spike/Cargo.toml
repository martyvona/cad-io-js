[package]
name = "mtruck_spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monstertruck-meshing = { path = "/Users/vona/src/others/monstertruck/monstertruck-meshing", features = ["analyzers", "filters", "tessellation"] }
monstertruck-io = { path = "/Users/vona/src/others/monstertruck/monstertruck-io", default-features = false, features = ["step"] }
monstertruck-topology = { path = "/Users/vona/src/others/monstertruck/monstertruck-topology" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

